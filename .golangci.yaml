version: "2"

run:
  concurrency: 0
  issues-exit-code: 1
  tests: true
  timeout: 5m
  modules-download-mode: readonly

linters:
  # Keep the list explicit so golangci-lint upgrades cannot silently change policy.
  default: none
  enable:
    # Correctness, error handling, and resource lifetime.
    - bodyclose
    - contextcheck
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - wrapcheck

    # Security and API boundaries.
    - asciicheck
    - bidichk
    - canonicalheader
    - containedctx
    - forcetypeassert
    - gosec
    - noctx

    # Maintainability and consistent design.
    - asasalint
    - cyclop
    - depguard
    - dogsled
    - dupl
    - exhaustive
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - godox
    - interfacebloat
    - maintidx
    - musttag
    - nakedret
    - nestif
    - nolintlint
    - predeclared
    - recvcheck
    - revive
    - thelper
    - tparallel
    - unparam
    - unqueryvet
    - zerologlint

    # Modern Go and standard-library simplifications.
    - copyloopvar
    - exptostd
    - fatcontext
    - intrange
    - mirror
    - modernize
    - nosprintfhostport
    - perfsprint
    - usestdlibvars
    - usetesting

    # Source and prose hygiene.
    - dupword
    - forbidigo
    - goprintffuncname
    - misspell
    - whitespace

  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/caitunai/go-blueprint
            - github.com/rs/zerolog
            - github.com/spf13/viper
            - github.com/gin-gonic/gin
            - github.com/redis/go-redis
            - github.com/go-redis/cache
            - github.com/go-resty/resty
            - github.com/spf13/cobra
            - github.com/gin-contrib
            - github.com/golang-jwt/jwt
            - github.com/ThreeDotsLabs/watermill
            - github.com/ThreeDotsLabs/watermill-redisstream
            - github.com/ThreeDotsLabs/watermill/message
            - gorm.io/driver
            - gorm.io/gorm
            - ariga.io/atlas/atlasexec
            - github.com/joho/godotenv
          deny:
            - pkg: reflect
              desc: Prefer type-safe code over reflection.
            - pkg: github.com/pkg/errors
              desc: Use the standard library errors package.
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    staticcheck:
      checks:
        - all

  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  # Enforce all rules on every changed Go file while legacy debt is retired.
  new-from-merge-base: main
  whole-files: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/caitunai/go-blueprint
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/caitunai/go-blueprint
  exclusions:
    generated: strict
    warn-unused: true
